name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Platform Scaffolding
        run: |
          flutter create --platforms=android --org com.barkabook .

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: barka-book-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Publish Direct Downloadable Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-preview"
          name: "Barka's Book v1.0.0 Test APK"
          body: |
            ### 📱 Barka's Book Test APK for Android
            This is the direct test APK for Barka Faral's mobile / tablet device.
            
            **How to install on phone:**
            1. Tap on `app-debug.apk` below to download.
            2. Open the downloaded file on your phone.
            3. Tap **Install** (allow install from browser if prompted).
            4. Enjoy Barka's Book! 🌸
          files: build/app/outputs/flutter-apk/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
