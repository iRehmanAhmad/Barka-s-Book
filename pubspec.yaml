name: barka_book
description: "Barka's Book — Interactive Living Book & Educational Syllabus App for Kids"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  hive_flutter: ^1.1.0
  google_fonts: ^6.2.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/books/barka_nursery/
    - assets/audio/sfx/
    - assets/audio/english/phonics/
    - assets/audio/english/words/
    - assets/audio/urdu/phonics/
    - assets/audio/urdu/words/
    - assets/audio/maths/
    - assets/animations/
    - assets/images/
